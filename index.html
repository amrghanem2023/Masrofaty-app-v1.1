<style>
  :root{
    --bg:#12151C;
    --surface:#1B2029;
    --surface-2:#232936;
    --surface-3:#2B3140;
    --border:#2C3140;
    --border-soft:#242938;
    --gold:#D4A24C;
    --gold-dim:#8A6C34;
    --gold-bg:#2B2416;
    --teal:#3DBD75;
    --teal-bg:#173324;
    --coral:#E5484D;
    --coral-bg:#3A1E1E;
    --blue:#4C8FE8;
    --blue-bg:#182A42;
    --text-1:#F2EFE9;
    --text-2:#9FA4B3;
    --text-3:#6E7386;
    --font-display-ar:'Almarai', sans-serif;
    --font-body-ar:'IBM Plex Sans Arabic', sans-serif;
    --font-display-en:'Inter', sans-serif;
    --font-body-en:'Inter', sans-serif;
    --font-display:var(--font-display-ar);
    --font-body:var(--font-body-ar);
  }
  .phone.light-theme{
    --bg:#F6F1E7;
    --surface:#FFFFFF;
    --surface-2:#F1EADB;
    --surface-3:#E7DEC9;
    --border:#E3DAC3;
    --border-soft:#EBE3D1;
    --gold:#B8843A;
    --gold-dim:#B8843A;
    --gold-bg:#F4E6C6;
    --teal:#1F9D5A;
    --teal-bg:#DDF3E6;
    --coral:#D6403D;
    --coral-bg:#FBE2E0;
    --blue:#2B6DE0;
    --blue-bg:#E1EAFC;
    --text-1:#241F16;
    --text-2:#726B59;
    --text-3:#A39C89;
  }
  .phone.lang-en{
    --font-display:var(--font-display-en);
    --font-body:var(--font-body-en);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    background:#05060A;
    color:var(--text-1);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:18px 0;
  }
  .stage{
    width:100%;
    max-width:430px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .phone{
    width:100%;
    max-width:412px;
    height:860px;
    max-height:88vh;
    background:var(--bg);
    color:var(--text-1);
    border-radius:38px;
    border:5px solid var(--gold);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 4px #0A0C11, 0 0 0 5px #000;
    transition:border-color .25s;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    font-family:var(--font-body);
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:130px; height:22px; background:#0A0C11; border-radius:0 0 16px 16px; z-index:50;
  }
  .screen{
    flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .topbar{
    padding:26px 20px 10px;
    flex-shrink:0;
  }
  .content{
    flex:1; overflow-y:auto; overflow-x:hidden; padding:0 18px 100px;
    scrollbar-width:none;
  }
  .content::-webkit-scrollbar{display:none;}

  h1,h2,h3{font-family:var(--font-display); font-weight:800; color:var(--text-1);}
  .num{font-family:var(--font-display); font-variant-numeric:tabular-nums; font-weight:800;}

  /* ===== Bottom Nav ===== */
  .navbar{
    position:absolute; bottom:0; left:0; right:0; height:84px;
    background:rgba(27,32,41,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-around;
    padding-bottom:14px; z-index:40;
  }
  .phone.light-theme .navbar{ background:rgba(255,255,255,.92); }
  .nav-btn{
    background:none; border:none; color:var(--text-3); display:flex; flex-direction:column;
    align-items:center; gap:4px; font-size:12px; font-family:var(--font-body); font-weight:600;
    padding:6px 10px; cursor:pointer; transition:color .15s;
  }
  .nav-btn.active{color:var(--gold);}
  .nav-btn svg{width:23px; height:23px;}
  .fab{
    width:56px; height:56px; border-radius:50%; background:var(--gold); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 8px 20px -4px rgba(212,162,76,.5); margin-top:-30px;
    transition:transform .12s;
  }
  .fab:active{transform:scale(.92);}
  .fab svg{width:26px; height:26px; stroke:#14171F;}

  /* ===== Cards ===== */
  .card{background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; padding:16px;}
  .row{display:flex; align-items:center; justify-content:space-between;}
  .muted{color:var(--text-2); font-size:14.5px;}
  .tiny{color:var(--text-3); font-size:13px;}

  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:100px;
    background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-2);
    font-size:14.5px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:var(--font-body);
  }
  .chip.active{background:var(--gold-bg); border-color:var(--gold-dim); color:var(--gold);}
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}

  button{font-family:var(--font-body); cursor:pointer;}
  input,select{font-family:var(--font-body); color:var(--text-1); background:var(--surface-2); border:1px solid var(--border-soft); border-radius:12px; padding:12px 14px; font-size:16px; width:100%; outline:none;}
  input:focus,select:focus{border-color:var(--gold-dim);}
  input::placeholder{color:var(--text-3);}
  label.field-label{display:block; font-size:13.5px; color:var(--text-2); margin-bottom:6px; font-weight:600;}

  .btn-primary{background:var(--gold); color:#14171F; border:none; border-radius:14px; padding:15px; font-weight:700; font-size:16px; width:100%;}
  .btn-primary:active{opacity:.85;}
  .btn-ghost{background:var(--surface-2); color:var(--text-1); border:1px solid var(--border-soft); border-radius:14px; padding:14px; font-weight:700; font-size:15px; width:100%;}
  .btn-danger{background:var(--coral-bg); color:var(--coral); border:1px solid #4A2A20; border-radius:14px; padding:14px; font-weight:700; font-size:15px; width:100%;}

  .cat-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:23px; flex-shrink:0;}
  .section-title{display:flex; align-items:center; justify-content:between; margin:22px 0 12px;}
  .section-title h2{font-size:16.5px;}
  .link-btn{background:none; border:none; color:var(--gold); font-size:13.5px; font-weight:700; font-family:var(--font-body);}

  .tx-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px dashed var(--border-soft);}
  .tx-item:last-child{border-bottom:none;}
  .tx-item-title{font-size:15.5px; font-weight:600;}

  .overlay{
    position:absolute; inset:0; background:var(--bg); z-index:60; display:flex; flex-direction:column;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .overlay-header{padding:20px 18px 12px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  .overlay-body{flex:1; overflow-y:auto; padding:0 18px 24px; scrollbar-width:none;}
  .overlay-body::-webkit-scrollbar{display:none;}
  .icon-btn{width:38px; height:38px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center;}
  .icon-btn svg{width:19px; height:19px; stroke:var(--text-1);}

  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px;}
  .keypad button{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:12px; height:44px; font-size:17px; font-weight:700; color:var(--text-1); font-family:var(--font-display);}
  .keypad button:active{background:var(--surface-3);}

  .modal-backdrop{position:absolute; inset:0; background:rgba(5,6,10,.6); z-index:80; display:flex; align-items:flex-end;}
  .modal-sheet{background:var(--surface); border-radius:22px 22px 0 0; padding:22px 18px 26px; width:100%; border-top:1px solid var(--border-soft);}

  .empty-state{text-align:center; padding:50px 20px; color:var(--text-2);}
  .empty-state svg{width:44px; height:44px; stroke:var(--text-3); margin-bottom:14px;}
  .empty-state-title{font-weight:700; color:var(--text-1); font-size:16px;}

  ::selection{background:var(--gold-dim); color:#fff;}
</style>
</head>

async function storageGet(key){
  if(typeof window.storage !== 'undefined' && window.storage && window.storage.get){
    try{
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(typeof window.storage !== 'undefined' && window.storage && window.storage.set){
    try{ await window.storage.set(key, value, false); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}

    if(state.subscription.status==='active' && !state.subscription.activatedAt) state.subscription.activatedAt = Date.now();
    if(!state.meterBudgets) state.meterBudgets = {electricity:0, gas:0, water:0};
    if(state.budgetAutoLink===undefined) state.budgetAutoLink = false;
    if(!state.budgetAutoLinkPercent) state.budgetAutoLinkPercent = 80;
    if(state.subscriptionPlan===undefined) state.subscriptionPlan = null;
    state.creditPurchases.forEach(p=>{ if(!p.paidInstallments) p.paidInstallments = []; });

function dateLabel(dstr){
  if(dstr===todayStr()) return t('today');
  const y = new Date(); y.setDate(y.getDate()-1);
  if(dstr===isoDate(y)) return t('yesterday');
  const d = parseDate(dstr);
  return `${WD()[d.getDay()]} ${d.getDate()} ${MO()[d.getMonth()]}`;
}
function daysInMonth(d=new Date()){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function addMonthsClamped(date, months){
  const day = date.getDate();
  const d = new Date(date);
  d.setDate(1);
  d.setMonth(d.getMonth()+months);
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d;
}
function startOfWeek(d=new Date()){ const x=new Date(d); const diff=x.getDay(); x.setDate(x.getDate()-diff); x.setHours(0,0,0,0); return x; }

function sumTx(txs){ return txs.reduce((a,t)=>a+t.amount,0); }
function txInRange(fromDate, toDate){
  return state.transactions.filter(t=>{
    const d = parseDate(t.date);
    return d>=fromDate && d<=toDate;
  });
}
function todayTx(){ return state.transactions.filter(t=>t.date===todayStr()); }
function weekTx(){ const s=startOfWeek(); const e=new Date(); e.setHours(23,59,59,999); return txInRange(s,e); }
function monthTx(ref=new Date()){ const s=new Date(ref.getFullYear(),ref.getMonth(),1); const e=new Date(ref.getFullYear(),ref.getMonth()+1,0,23,59,59); return txInRange(s,e); }
function effectiveMonthlyBudget(){
  if(state.budgetAutoLink){
    const incomeMonth = sumTx(incomeTx(monthTx()));
    return Math.round(incomeMonth * (state.budgetAutoLinkPercent/100));
  }
  return state.monthlyBudget;
}

function compressImage(file, maxW=640, quality=0.55){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.max(1, Math.round(img.width*scale));
        const h = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function drawBudgetRing(){
  const svg = document.getElementById('budget-ring');
  if(!svg) return;
  const budget = effectiveMonthlyBudget();
  const dailyAllowance = budget>0 ? budget/daysInMonth() : 0;
  const spentToday = sumTx(expenseTx(todayTx()));
  const pct = dailyAllowance>0 ? Math.min(spentToday/dailyAllowance,1) : 0;
  const over = dailyAllowance>0 && spentToday>dailyAllowance;
  const color = over ? '#E5484D' : (pct>0.85 ? '#D4A24C' : '#3DBD75');
  const r = 50, cx=60, cy=60, circ = 2*Math.PI*r;
  let ticks = '';
  for(let i=0;i<12;i++){
    const ang = (i/12)*2*Math.PI - Math.PI/2;
    const x1 = cx + Math.cos(ang)*44, y1 = cy + Math.sin(ang)*44;
    const x2 = cx + Math.cos(ang)*40, y2 = cy + Math.sin(ang)*40;
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2C3140" stroke-width="2" stroke-linecap="round"/>`;
  }
  svg.innerHTML = `
    ${ticks}
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#232936" stroke-width="8"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}" transform="rotate(-90 ${cx} ${cy})"/>
  `;
}

function getPeriodRange(period){
  const now = new Date();
  if(period==='week'){ const s=startOfWeek(now); const e=new Date(); e.setHours(23,59,59,999); return [s,e]; }
  if(period==='month'){ return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59)]; }
  return [new Date(now.getFullYear(),0,1), new Date(now.getFullYear(),11,31,23,59,59)];
}
function getPrevPeriodRange(period){
  const now = new Date();
  if(period==='week'){ const s=startOfWeek(now); s.setDate(s.getDate()-7); const e=new Date(s); e.setDate(e.getDate()+6); e.setHours(23,59,59,999); return [s,e]; }
  if(period==='month'){ const m=now.getMonth()-1, y=m<0?now.getFullYear()-1:now.getFullYear(); const mm=(m+12)%12; return [new Date(y,mm,1), new Date(y,mm+1,0,23,59,59)]; }
  return [new Date(now.getFullYear()-1,0,1), new Date(now.getFullYear()-1,11,31,23,59,59)];
}

  const barColor = cs.getPropertyValue('--surface-3').trim() || '#3A4152';

  const donut = document.getElementById('donut-chart');

    txs.forEach(t=>{ totals[t.categoryId]=(totals[t.categoryId]||0)+t.amount; });
    const sorted = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
    const r=50, cx=60, cy=60, circ=2*Math.PI*r;

    if(total>0){

  }

  const bar = document.getElementById('bar-chart');
  if(bar){
    let buckets = [];

      const s0 = startOfWeek();
      for(let i=0;i<7;i++){

      const dim = daysInMonth(now);
      const weeks = 4;
      for(let w=0;w<weeks;w++){
        const from = w*Math.ceil(dim/weeks)+1;
        const to = Math.min(dim, (w+1)*Math.ceil(dim/weeks));
        const s0 = new Date(now.getFullYear(), now.getMonth(), from);
        const e0 = new Date(now.getFullYear(), now.getMonth(), to, 23,59,59);
        buckets.push({label: state.language==='en' ? ('W'+(w+1)) : ('أ'+toArabicDigits(w+1)), value:sumTx(expenseTx(txInRange(s0,e0)))});
      }
    } else {
      const now = new Date();
      for(let m=0;m<12;m++){
        const s0 = new Date(now.getFullYear(), m, 1);
        const e0 = new Date(now.getFullYear(), m+1, 0, 23,59,59);
        buckets.push({label:MO()[m].slice(0,3), value:sumTx(expenseTx(txInRange(s0,e0)))});
      }
    }
    const max = Math.max(1, ...buckets.map(b=>b.value));
    const w = 320, h=168, padB=30, padT=14, n=buckets.length;
    const gap = 8, bw = (w-gap*(n-1))/n;
    const isRtl = state.language!=='en';
    let bars = '';
    buckets.forEach((b,i)=>{
      const bh = ((h-padB-padT) * (b.value/max)) || 0;
      const pos = isRtl ? (n-1-i) : i;
      const x = pos*(bw+gap);
      const y = h-padB-bh;
      const isToday = period==='week' && i===new Date().getDay();
      bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,2)}" rx="4" fill="${isToday?'#D4A24C':barColor}"/>`;
      bars += `<text x="${x+bw/2}" y="${h-10}" text-anchor="middle" fill="${textColor}" font-size="12" font-weight="700" font-family="IBM Plex Sans Arabic, Inter, sans-serif">${b.label}</text>`;
    });
    bar.innerHTML = bars;
  }
}

function filteredTx(){
  let txs = [...state.transactions];
  if(ui.historyTypeFilter && ui.historyTypeFilter!=='all') txs = txs.filter(t=>t.type===ui.historyTypeFilter);
  if(ui.historyCatFilter) txs = txs.filter(t=>t.categoryId===ui.historyCatFilter);
  if(ui.historyPeriod==='week'){
    const s = startOfWeek(); const e = new Date(); e.setHours(23,59,59,999);
    txs = txs.filter(t=>{ const d = parseDate(t.date); return d>=s && d<=e; });
  } else if(ui.historyPeriod==='month' && ui.historyMonthValue){
    txs = txs.filter(t=> t.date.slice(0,7)===ui.historyMonthValue);
  } else if(ui.historyPeriod==='year' && ui.historyYearValue){
    txs = txs.filter(t=> t.date.slice(0,4)===String(ui.historyYearValue));
  }
  if(ui.historySearch.trim()){
    const q = ui.historySearch.trim().toLowerCase();
    txs = txs.filter(t=> (t.note||'').toLowerCase().includes(q) || catName(catById(t.categoryId, t.type)).toLowerCase().includes(q));
  }
  return txs.sort((a,b)=>b.createdAt-a.createdAt);
}

function getReadingsWithConsumption(type){
  const asc = state.meterReadings.filter(r=>r.type===type).sort((a,b)=>a.month.localeCompare(b.month));
  const withDelta = asc.map((r,i)=> ({...r, consumption: i>0 ? (r.value - asc[i-1].value) : null}));
  return withDelta.slice().reverse();
}

function monthLabel(m){
  if(!m) return '';
  const [y,mo] = m.split('-').map(Number);
  return `${MO()[mo-1]} ${y}`;
}

function meterInsight(type){
  const readings = getReadingsWithConsumption(type); // descending, each has .consumption (vs previous)
  const withDelta = readings.filter(r=>r.consumption!==null);
  let trendMsg = '';
  if(withDelta.length>=2){
    const latest = withDelta[0].consumption, prev = withDelta[1].consumption;
    if(prev>0){
      const pct = Math.round(((latest-prev)/prev)*100);
      if(pct>=10) trendMsg = t('consumptionUp', pct);
      else if(pct<=-10) trendMsg = t('consumptionDown', Math.abs(pct));
      else trendMsg = t('consumptionStable');
    }
  } else {
    trendMsg = t('notEnoughForCompare');
  }
  const tips = t('tip_'+type);
  const tip = Array.isArray(tips) ? tips[readings.length % tips.length] : '';
  let predicted = null;
  if(withDelta.length>=1){
    const avg = withDelta.reduce((s,r)=>s+r.consumption,0)/withDelta.length;
    predicted = Math.round((readings[0].value + avg)*10)/10;
  }
  return {trendMsg, tip, predicted};
}

function renderMiniBarChart(vals, color){
  const nums = vals.map(v=>v.consumption);
  const max = Math.max(1, ...nums);
  const w=300, h=90, padB=16, n=nums.length, gap=6, bw=(w-gap*(n-1))/n;
  let out = '';
  nums.forEach((v,i)=>{
    const bh = ((h-padB)*(v/max))||0;
    const x = i*(bw+gap);
    const y = h-padB-bh;
    out += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,2)}" rx="3" fill="${color}"/>`;
  });
  return out;
}

/* ================= CREDIT PAYMENTS ================= */
function creditCalc(p){
  const totalInterest = p.principal * (p.interestRate/100) * (p.months/12);
  const totalToRepay = p.principal + totalInterest;
  const monthlyInstallment = p.months>0 ? totalToRepay/p.months : totalToRepay;
  const monthsElapsed = Math.min(p.months, (p.paidInstallments||[]).length);
  const remainingMonths = Math.max(0, p.months - monthsElapsed);
  const remainingBalance = Math.max(0, totalToRepay - (monthlyInstallment*monthsElapsed));
  return {totalInterest, totalToRepay, monthlyInstallment, monthsElapsed, remainingMonths, remainingBalance};
}

function generateDueInstallments(){
  const today = new Date();
  let changed = false;
  const newOnes = [];
  state.creditPurchases.forEach(p=>{
    if(!p.paidInstallments) p.paidInstallments = [];
    const purchaseDate = parseDate(p.date);
    const totalInterest = p.principal * (p.interestRate/100) * (p.months/12);
    const totalToRepay = p.principal + totalInterest;
    const installmentAmt = p.months>0 ? totalToRepay/p.months : totalToRepay;
    for(let i=1;i<=p.months;i++){
      if(p.paidInstallments.includes(i)) continue;
      const dueDate = addMonthsClamped(purchaseDate, i);
      if(dueDate <= today){
        state.transactions.push({
          id: uid(),
          type: 'expense',
          categoryId: 'installments',
          amount: installmentAmt,
          note: `${p.description} — ${t('installmentNote')} ${i}/${p.months}`,
          date: isoDate(dueDate),
          createdAt: dueDate.getTime(),
          creditId: p.id,
          installmentIndex: i,
        });
        p.paidInstallments.push(i);
        changed = true;
        newOnes.push({desc:p.description, amount:installmentAmt, index:i, months:p.months});
      }
    }
  });
  if(changed) saveState();
  return newOnes;
}

function totalCreditUsed(){
  return state.creditPurchases.reduce((sum,p)=> sum + creditCalc(p).remainingBalance, 0);

function isYesterday(dstr){ const y=new Date(); y.setDate(y.getDate()-1); return dstr===isoDate(y); }

function currentMonthStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

}
function upcomingVisaDue(){
  const today = new Date();
  let nearest = null;
  state.creditPurchases.forEach(p=>{
    const paid = (p.paidInstallments||[]).length;
    if(paid>=p.months) return;
    const nextIndex = paid+1;
    const dueDate = addMonthsClamped(parseDate(p.date), nextIndex);
    const daysUntil = Math.ceil((dueDate-today)/86400000);
    if(daysUntil>=0 && daysUntil<=3){
      const totalInterest = p.principal*(p.interestRate/100)*(p.months/12);
      const amt = (p.principal+totalInterest)/p.months;
      if(!nearest || daysUntil<nearest.daysUntil) nearest = {desc:p.description, amt, daysUntil};
    }
  });
  return nearest;
}

function buildReportWorkbook(){
  const headerRow = [t('colDate'), t('colType'), t('colCategory'), t('colAmount'), t('colPaymentMethod'), t('colNote')];
  const rows = [headerRow];
  [...state.transactions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(tx=>{
    rows.push([
      tx.date,
      tx.type==='income' ? t('incomeLabel') : t('expenseLabel'),
      catName(catById(tx.categoryId, tx.type)),
      tx.amount,
      tx.creditId ? t('payVisa') : t('payCash'),
      tx.note || ''
    ]);
  });
  const wsTx = XLSX.utils.aoa_to_sheet(rows);

  const mTx = monthTx();
  const mExpense = sumTx(expenseTx(mTx));
  const mIncome = sumTx(incomeTx(mTx));
  const summaryRows = [
    [t('name'), t('amount')],
    [t('expense'), mExpense],
    [t('income'), mIncome],
    [t('balance'), mIncome - mExpense],
    [t('monthlyBudgetTitle'), effectiveMonthlyBudget()],
  ];
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);

  const visaHeaderRow = [t('colPurchaseDesc'), t('colPurchaseDate'), t('colPrincipal'), t('colMonths'), t('colInterestRate'), t('colInstallmentAmt'), t('colPaidCount'), t('colRemaining')];
  const visaRows = [visaHeaderRow];
  [...state.creditPurchases].sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{
    const calc = creditCalc(p);
    visaRows.push([
      p.description,
      p.date,
      p.principal,
      p.months,
      p.interestRate || 0,
      Math.round(calc.monthlyInstallment*100)/100,
      (p.paidInstallments||[]).length,
      Math.round(calc.remainingBalance*100)/100,
    ]);
  });
  const wsVisa = XLSX.utils.aoa_to_sheet(visaRows);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, t('monthSummary'));
  XLSX.utils.book_append_sheet(wb, wsTx, t('nav_history'));
  XLSX.utils.book_append_sheet(wb, wsVisa, t('visaSheetTitle').slice(0,28));
  return wb;
}

function initGoogleDriveClient(){

function connectGoogleDrive(){
  if(typeof google==='undefined' || !google.accounts){ ui.driveStatus='not-loaded'; render(); return; }
  if(GOOGLE_CLIENT_ID.includes('PASTE_YOUR')){ ui.driveStatus='not-configured'; render(); return; }
  try{
    if(!googleTokenClient) initGoogleDriveClient();
    googleTokenClient.requestAccessToken();
  }catch(e){

    render();
  }
}
async function findDriveBackupFileId(){
  const q = encodeURIComponent(`name='${DRIVE_BACKUP_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers:{ Authorization:`Bearer ${googleAccessToken}` }
  });
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}
async function backupToGoogleDrive(){
  if(!googleAccessToken){ connectGoogleDrive(); return; }
  ui.driveBusy = true; render();
  try{
    const fileId = await findDriveBackupFileId();
    const metadata = { name: DRIVE_BACKUP_FILENAME, mimeType:'application/json' };
    const boundary = 'masrofaty_boundary';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${fileId?'{}':JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(state)}\r\n--${boundary}--`;
    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    await fetch(url, {
      method: fileId ? 'PATCH' : 'POST',
      headers:{ Authorization:`Bearer ${googleAccessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    ui.driveLastBackup = new Date().toLocaleString(state.language==='en'?'en-US':'ar-EG');
  }catch(e){}
  ui.driveBusy = false; render();
}
function restoreFromGoogleDrive(){
  if(!googleAccessToken){ connectGoogleDrive(); return; }
  askConfirm(t('confirmRestoreDrive'), async ()=>{
    ui.driveBusy = true; ui.overlay = null; render();
    try{
      const fileId = await findDriveBackupFileId();
      if(fileId){
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
          headers:{ Authorization:`Bearer ${googleAccessToken}` }
        });
        state = await res.json();
        saveState();
      }
    }catch(e){}
    ui.driveBusy = false;
    applyTheme(); applyAccent(); applyLang();
    render();
  });
}

function exportLocalBackup(){

  a.href = url; a.download = `masrofaty-backup-${todayStr()}.json`;

function importLocalBackup(file){
  askConfirm(t('confirmImportBackup'), ()=>{
    ui.overlay = null;
    ui.importError = '';
    ui.importSuccess = '';
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!data || typeof data!=='object' || !Array.isArray(data.transactions)){
          throw new Error('invalid-backup-shape');
        }
        // Merge onto a fresh defaultState() rather than overwriting `state` outright,
        // so a backup file from an older app version (missing newer fields like
        // subscriptionPlan/budgetAutoLink/etc.) can't leave the app in a broken,
        // half-initialized state that crashes on the next render().
        const merged = defaultState();
        for(const k in data){ if(data[k]!==null && data[k]!==undefined) merged[k] = data[k]; }
        state = merged;
        saveState();
        applyTheme(); applyAccent(); applyLang();
        ui.importSuccess = t('importSuccess');
        render();
      }catch(err){
        ui.importError = t('importError');
        render();
      }
    };
    reader.onerror = ()=>{
      ui.importError = t('importError');
      render();
    };
    reader.readAsText(file);
  });
}

/* ================= SUBSCRIPTION / TRIAL ================= */
const TRIAL_DAYS = 90;
const TRIAL_WARN_DAYS = 15;
function trialDaysLeft(){
  if(!state.subscription) return TRIAL_DAYS;
  const elapsed = Math.floor((Date.now()-state.subscription.trialStart)/86400000);
  return Math.max(0, TRIAL_DAYS-elapsed);
}
const SUBSCRIPTION_PERIOD_DAYS = 30;
function subscriptionDaysLeft(){
  if(!state.subscription || state.subscription.status!=='active' || !state.subscription.activatedAt) return 0;
  if(state.subscription.lifetime) return null;
  const periodDays = state.subscription.periodDays || SUBSCRIPTION_PERIOD_DAYS;
  const elapsed = Math.floor((Date.now()-state.subscription.activatedAt)/86400000);
  return Math.max(0, periodDays-elapsed);
}
function checkSubscriptionExpiry(){
  // recurring plan (basic or premium): locks the app exactly one billing period after activation,
  // unless a lifetime code was used (never expires)
  if(state.subscription && state.subscription.status==='active' && state.subscription.activatedAt && !state.subscription.lifetime){
    const periodDays = state.subscription.periodDays || SUBSCRIPTION_PERIOD_DAYS;
    const elapsed = Math.floor((Date.now()-state.subscription.activatedAt)/86400000);
    if(elapsed>=periodDays){
      state.subscription.status = 'expired';
      saveState();
    }
  }
}
function isSubscriptionActive(){
  checkSubscriptionExpiry();
  return state.subscription && (state.subscription.status==='active' || trialDaysLeft()>0);
}

/* ================= FEATURE GATING (PLAN TIERS) ================= */
const TIER_RANK = {free:0, basic:1, premium:2};
function currentTier(){
  checkSubscriptionExpiry();
  if(state.subscription && state.subscription.status==='active'){
    return state.subscriptionPlan==='premium' ? 'premium' : (state.subscriptionPlan==='basic' ? 'basic' : 'free');
  }
  // during the 90-day free trial, give a full preview of premium features
  if(trialDaysLeft()>0) return 'premium';
  return 'free';
}
function hasTier(minTier){
  return TIER_RANK[currentTier()] >= TIER_RANK[minTier];
}
function tierBadge(minTier){
  return minTier==='premium' ? t('badgePremium') : t('badgeBasic');
}
function renderLockCard(minTier, bodyText){
  const title = minTier==='premium' ? t('lockedPremiumTitle') : t('lockedBasicTitle');
  const body = bodyText || (minTier==='premium' ? t('lockedPremiumBody') : t('lockedBasicBody'));
  return `
  <div class="card" style="text-align:center; padding:28px 18px;">
    <div style="font-size:30px; margin-bottom:10px;">🔒</div>
    <div style="font-weight:800; font-size:15.5px; margin-bottom:6px;">${title}</div>
    <div class="tiny" style="line-height:1.7; margin-bottom:16px;">${body}</div>
    <button class="btn-primary" data-nav="plans">${t('unlockBtn')}</button>
  </div>`;
}
function computeActivationCode(deviceCode, planId, duration){
  const seed = deviceCode + '|' + (planId||'') + (duration && duration!=='month' ? '|'+duration : '');
  let sum = 0;
  for(const ch of seed) sum += ch.charCodeAt(0);
  return String((sum*7)%9973).padStart(4,'0');
}

function renderPaywallScreen(){
  const screen = document.getElementById('screen');
  const code = state.profile ? state.profile.deviceCode : '';
  screen.innerHTML = `
  <div class="topbar"><h1 style="font-size:20px;">${t('paywallTitle')}</h1></div>
  <div class="content" style="padding-bottom:40px;">
    <div class="card">
      <div class="muted" style="line-height:1.8;">${t('paywallBody')}</div>
      <div class="tiny" style="margin-top:14px;">${t('deviceCode')}: <span class="num" style="direction:ltr;">${code}</span></div>
    </div>

    <div class="section-title"><h2>${t('plansTitle')}</h2></div>
    ${renderPlanCards()}

    <button class="btn-primary" style="margin-top:18px;" data-action="subscribe-contact">${t('subscribeNow')}</button>

    <div class="card" style="margin-top:14px; text-align:center;">
      <div class="tiny" style="font-weight:700; margin-bottom:8px;">${t('contactUsLabel')}</div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <a href="https://wa.me/${CONTACT_PHONE}" target="_blank" class="tiny" style="color:var(--gold); text-decoration:none; direction:ltr;">${t('contactUsPhoneWhatsapp', '+'+CONTACT_PHONE)}</a>
        <a href="mailto:${ACTIVATION_EMAIL}" class="tiny" style="color:var(--gold); text-decoration:none; direction:ltr;">${t('contactUsEmailLabel', ACTIVATION_EMAIL)}</a>
      </div>
    </div>

    ${renderActivationCodeBox()}
  </div>`;

  screen.querySelectorAll('[data-choose-plan]').forEach(el=>el.addEventListener('click', ()=>{
    ui.pendingPlanId = el.dataset.choosePlan; ui.activationError=''; renderPaywallScreen();
  }));
  screen.querySelectorAll('[data-activate-plan]').forEach(el=>el.addEventListener('click', ()=>{
    activatePlanRequest(el.dataset.activatePlan); renderPaywallScreen();
  }));
  const contactBtn = screen.querySelector('[data-action="subscribe-contact"]');
  if(contactBtn) contactBtn.addEventListener('click', ()=>{
    const subject = encodeURIComponent(`${t('appName')} — ${t('subscribeNow').replace('✉️','').trim()}`);
    const planName = ui.pendingPlanId ? t('plan_'+ui.pendingPlanId+'_name') : '';
    const body = encodeURIComponent(`${t('fullName')}: ${state.profile?.name||''}\n${t('emailAddress')}: ${state.profile?.email||''}\n${t('deviceCode')}: ${code}${planName?`\n${t('plansTitle')}: ${planName}`:''}`);
    window.open(`mailto:${ACTIVATION_EMAIL}?subject=${subject}&body=${body}`, '_blank');
  });
  const submitCodeBtn = screen.querySelector('[data-action="submit-activation-code"]');
  if(submitCodeBtn) submitCodeBtn.addEventListener('click', ()=>{ submitActivationCode(()=>{ render(); }); });
}

function genDeviceCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<8;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s.slice(0,4)+'-'+s.slice(4);
}

function validateProfileFields(name, email){
  if(!name || !email) return t('fieldRequired');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return t('invalidEmail');
  return null;
}

function renderOnboarding(){
  return `
  <div class="topbar">
    <h1 style="font-size:22px;">${t('welcomeTitle')}</h1>
  </div>
  <div class="content" style="padding-bottom:40px;">
    <div class="muted" style="margin-bottom:22px; line-height:1.8;">${t('welcomeSubtitle')}</div>
    <label class="field-label">${t('fullName')}</label>
    <input id="onboard-name" placeholder="${t('fullName')}">
    <label class="field-label" style="margin-top:16px;">${t('emailAddress')}</label>
    <input id="onboard-email" type="email" dir="ltr" style="text-align:left;" placeholder="example@email.com">
    ${ui.onboardError ? `<div class="tiny" style="margin-top:12px; color:var(--coral);">${ui.onboardError}</div>` : ''}
    <button class="btn-primary" style="margin-top:24px;" data-action="submit-onboarding">${t('activateBtn')}</button>
    <div class="tiny" style="margin-top:10px; text-align:center;">${t('activatingNote')}</div>
    <div style="text-align:center; margin-top:16px;"><button class="link-btn" data-action="view-privacy-onboarding">${t('privacyLink')}</button></div>
  </div>`;
}

function renderOnboardingScreen(){
  const screen = document.getElementById('screen');
  screen.innerHTML = renderOnboarding();
  const btn = screen.querySelector('[data-action="submit-onboarding"]');
  if(btn) btn.addEventListener('click', ()=>{
    const name = screen.querySelector('#onboard-name').value.trim();
    const email = screen.querySelector('#onboard-email').value.trim();
    const err = validateProfileFields(name, email);
    if(err){ ui.onboardError = err; renderOnboardingScreen(); return; }
    const deviceCode = genDeviceCode();
    state.profile = {name, email, deviceCode, activated:false, createdAt:Date.now()};
    saveState();
    ui.onboardError = '';
    sendActivationEmail(state.profile);
    render();
  });
  const privacyLinkBtn = screen.querySelector('[data-action="view-privacy-onboarding"]');
  if(privacyLinkBtn) privacyLinkBtn.addEventListener('click', ()=>{
    screen.innerHTML = renderPrivacyPage().replace('data-nav="settings"', 'data-action="back-to-onboarding"');
    const backBtn = screen.querySelector('[data-action="back-to-onboarding"]');
    if(backBtn) backBtn.addEventListener('click', renderOnboardingScreen);
  });
}

function sendActivationEmail(p){
  const subject = encodeURIComponent(`${t('appName')} — ${t('activateBtn').replace('✅','').trim()}`);
  const bodyLines = [
    `${t('fullName')}: ${p.name}`,
    `${t('emailAddress')}: ${p.email}`,
    `${t('deviceCode')}: ${p.deviceCode}`,
  ];
  const body = encodeURIComponent(bodyLines.join('\n'));
  window.open(`mailto:${ACTIVATION_EMAIL}?subject=${subject}&body=${body}`, '_blank');
}

function renderProfileEditOverlay(){
  const p = state.profile || {};
  return `
  <div class="overlay">
    <div class="overlay-header">
      <button class="icon-btn" data-action="close-overlay">${ICONS.x}</button>
      <h2 style="font-size:17px;">${t('editProfile')}</h2>
      <div style="width:38px;"></div>
    </div>
    <div class="overlay-body">
      <label class="field-label">${t('fullName')}</label>
      <input id="profile-name" value="${escapeHtml(p.name||'')}">
      <label class="field-label" style="margin-top:16px;">${t('emailAddress')}</label>
      <input id="profile-email" type="email" dir="ltr" style="text-align:left;" value="${escapeHtml(p.email||'')}">
      ${ui.profileEditError ? `<div class="tiny" style="margin-top:12px; color:var(--coral);">${ui.profileEditError}</div>` : ''}
      <button class="btn-primary" style="margin-top:24px;" data-action="save-profile">${t('saveProfile')}</button>
    </div>
  </div>`;
}

function saveProfileEdit(){
  const screen = document.getElementById('screen');
  const name = screen.querySelector('#profile-name').value.trim();
  const email = screen.querySelector('#profile-email').value.trim();
  const err = validateProfileFields(name, email);
  if(err){ ui.profileEditError = err; render(); return; }
  state.profile.name = name; state.profile.email = email;
  saveState();
  ui.profileEditError = '';
  ui.overlay = null;
  render();
}

async function boot(){
  document.getElementById('screen').innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#666B7C; font-size:13px;">جاري التحميل… / Loading…</div>`;
  await loadState();
  ui.installmentNotices = generateDueInstallments();
  applyTheme();
  applyAccent();
  applyLang();
  if(!state.profile){
    renderOnboardingScreen();
  } else if(!isSubscriptionActive()){
    renderPaywallScreen();
  } else {
    render();
  }
  setInterval(()=>{
    if(state.profile && !isSubscriptionActive() && ui.overlay!=='add' && ui.overlay!=='meter-add' && ui.overlay!=='credit-add'){
      renderPaywallScreen();
    }
  }, 60000);
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
